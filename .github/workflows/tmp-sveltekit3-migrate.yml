name: Temporary SvelteKit 3 migration

on:
  push:
    branches:
      - security/pmx-dependency-majors-20261016

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run official SvelteKit 3 migration
        run: npx --yes sv migrate sveltekit-3
      - name: Commit migration and remove temporary workflow
        run: |
          rm .github/workflows/tmp-sveltekit3-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "chore: apply official SvelteKit 3 migration"
          git push
