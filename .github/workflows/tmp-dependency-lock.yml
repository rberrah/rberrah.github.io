name: Temporary dependency lock refresh

on:
  push:
    branches:
      - maintenance/pmx-dependency-refresh-20261016

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/pmx-dependency-refresh-20261016
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "deps: refresh package lock"
          git push origin HEAD:maintenance/pmx-dependency-refresh-20261016
