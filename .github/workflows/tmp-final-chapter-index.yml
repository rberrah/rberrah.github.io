name: Temporary final chapter index generator

on:
  push:
    branches:
      - perf/chapter-metadata-split-20261016

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/chapter-metadata-split-20261016
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/generate_chapter_index.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/content/chapterIndex.generated.json src/lib/content/chapterSearch.generated.json
          if git diff --cached --quiet; then
            echo "Generated chapter files already current."
            exit 0
          fi
          git commit -m "perf: refresh generated chapter indexes"
          git pull --rebase origin perf/chapter-metadata-split-20261016
          git push origin HEAD:perf/chapter-metadata-split-20261016
