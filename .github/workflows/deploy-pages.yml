name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # La pharmacométrie est désormais servie sous /pharmacometrie/ ; la vraie
      # racine (/) héberge le portail statique (dossier portal/).
      - name: Build (pharmacométrie)
        env:
          BASE_PATH: /pharmacometrie
        run: npm run build

      - name: Assemble portail + pharmacométrie
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          # Garde-fou : les deux arborescences ne doivent jamais se recouvrir.
          # Le portail occupe la racine, le cours occupe /pharmacometrie/ ; si un
          # jour portal/pharmacometrie apparaissait, l'une écraserait l'autre en
          # silence. On préfère un échec bruyant.
          if [ -e portal/pharmacometrie ]; then
            echo "::error::portal/pharmacometrie existe et entrerait en collision avec le build SvelteKit."
            exit 1
          fi

          # 1) Le portail, EN ENTIER, à la racine de dist :
          #    index.html, 404.html, assets/, demos/, recherche/, research/,
          #    a-propos/, contact/, citer/, sitemap.xml, robots.txt…
          cp -r portal/. dist/

          # 2) Le cours de pharmacométrie dans son sous-dossier. Comme portal/ ne
          #    contient pas de dossier « pharmacometrie » (vérifié ci-dessus),
          #    cette copie n'écrase rien du portail, et le portail n'écrase rien
          #    du build : l'ordre des deux étapes est sans effet de bord.
          mkdir -p dist/pharmacometrie
          cp -r build/. dist/pharmacometrie/

          echo "--- dist (racine) ---"; ls -la dist
          echo "--- dist/pharmacometrie ---"; ls dist/pharmacometrie | head

      # Un déploiement silencieusement incomplet est le pire mode de défaillance
      # possible ici : les pages disparaissent sans que rien n'échoue. On vérifie
      # donc explicitement les quatre fichiers qui prouvent que l'assemblage a
      # fonctionné des deux côtés.
      - name: Vérifier l'intégrité de dist
        run: |
          set -euo pipefail
          manquant=0
          for f in \
            dist/index.html \
            dist/assets/site.css \
            dist/recherche/index.html \
            dist/pharmacometrie/index.html
          do
            if [ -f "$f" ]; then
              echo "ok        $f"
            else
              echo "::error::fichier attendu absent de dist : $f"
              manquant=1
            fi
          done
          if [ "$manquant" -ne 0 ]; then
            echo "Déploiement interrompu : l'assemblage du site est incomplet."
            exit 1
          fi

          # Contrôle non bloquant : toute URL annoncée dans le sitemap racine
          # doit correspondre à un fichier réellement présent. Les avertissements
          # remontent dans le résumé du run sans casser le déploiement.
          if [ -f dist/sitemap.xml ]; then
            grep -o '<loc>[^<]*</loc>' dist/sitemap.xml \
              | sed -e 's|<loc>https://rberrah.github.io||' -e 's|</loc>||' \
              | while read -r url; do
                  case "$url" in
                    */) cible="dist${url}index.html" ;;
                    *)  cible="dist${url}" ;;
                  esac
                  [ -f "$cible" ] || echo "::warning::sitemap : $url est annoncé mais $cible est absent de dist."
                done
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
