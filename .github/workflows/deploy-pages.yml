name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # La pharmacométrie est désormais servie sous /pharmacometrie/ ; la vraie
      # racine (/) héberge le portail statique (dossier portal/).
      - name: Build (pharmacométrie)
        env:
          BASE_PATH: /pharmacometrie
        run: npm run build

      - name: Assemble portail + pharmacométrie
        run: |
          rm -rf dist
          mkdir -p dist/pharmacometrie
          cp -r build/. dist/pharmacometrie/
          cp portal/index.html dist/index.html
          cp portal/404.html dist/404.html
          echo "--- dist tree (top) ---"; ls -la dist; ls dist/pharmacometrie | head

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
