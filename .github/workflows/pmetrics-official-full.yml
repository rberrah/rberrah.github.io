name: Pmetrics official full benchmark

on:
  push:
    branches: [main]
    paths:
      - 'integration/mipd-release.json'
      - 'src/content/chapters/08c_pmetrics-nonparametric.md'
      - 'src/content/chapters/en/08c_pmetrics-nonparametric.md'
      - 'scripts/test_pmetrics_backend.mjs'
      - 'scripts/test_pmetrics_course_consistency.mjs'
      - '.github/workflows/pmetrics-official-full.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'integration/mipd-release.json'
      - 'src/content/chapters/08c_pmetrics-nonparametric.md'
      - 'src/content/chapters/en/08c_pmetrics-nonparametric.md'
      - 'scripts/test_pmetrics_backend.mjs'
      - 'scripts/test_pmetrics_course_consistency.mjs'
      - '.github/workflows/pmetrics-official-full.yml'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-full:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      PMETRICS_VERSION: '3.2.6'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fetch standalone MIPD Engine from immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(node -p "JSON.parse(require('fs').readFileSync('integration/mipd-release.json','utf8')).sha")"
          source_dir="$RUNNER_TEMP/mipd-engine-source"
          rm -rf "$source_dir"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/rberrah/MIPD-Engine.git
          git -C "$source_dir" fetch --depth 1 origin "$sha"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$sha"
          echo "MIPD_ENGINE_DIR=$source_dir" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install pinned Pmetrics
        run: |
          Rscript -e 'rv <- paste(R.version$major, strsplit(R.version$minor, "\\.")[[1]][1], sep = "."); binary_repo <- function(universe) sprintf("https://%s.r-universe.dev/bin/linux/resolute-%s/%s", universe, R.version$arch, rv); cran_repo <- Sys.getenv("RSPM", unset = "https://cloud.r-project.org"); options(timeout = 600, repos = c(LAPKB = binary_repo("lapkb"), CRAN = cran_repo)); install.packages(c("Pmetrics", "jsonlite")); stopifnot(as.character(packageVersion("Pmetrics")) == Sys.getenv("PMETRICS_VERSION"))'
      - run: npm ci
      - name: Run official full benchmark
        run: npm run benchmark:pmetrics-official
      - name: Verify benchmark and course agree
        run: npm run test:pmetrics-course-consistency
      - name: Stage full benchmark result from standalone engine
        run: |
          mkdir -p test-results/pmetrics
          cp "$MIPD_ENGINE_DIR/pmetrics/benchmarks/pmetrics-official-example.json" test-results/pmetrics/
      - name: Archive full benchmark result
        uses: actions/upload-artifact@v7
        with:
          name: pmetrics-official-full
          path: test-results/pmetrics/pmetrics-official-example.json
          if-no-files-found: error
