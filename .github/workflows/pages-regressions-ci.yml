name: Pages regression repair

on:
  push:
    branches: [fix/pages-existing-e2e-regressions]
  pull_request:
    paths:
      - 'src/routes/**'
      - 'src/lib/components/MolecularScene.svelte'
      - 'tests/e2e/**'
      - 'portal/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/pages-regressions-ci.yml'

permissions:
  contents: read

jobs:
  browser-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify interdisciplinary lesson scientific calculations and valid links
        run: node scripts/test_cross_domain_pkpd.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run previously failing end-to-end scenarios
        env:
          LABS_E2E_PREBUILT: "true"
        run: >-
          npx playwright test
          tests/e2e/hydratation.spec.js
          tests/e2e/learning.spec.js
          tests/e2e/molecular-laboratories.spec.js
          tests/e2e/workshops.spec.js
          tests/e2e/covariate-lessons.spec.js
          --grep "Commencer le cours|synthesis-start|objects in the scene|Explorer exposes six workshops|Covariate lesson physiology en 390"
      - name: Verify root Multiomics redirects and deployed paths
        run: npx playwright test --config playwright.portal.config.js --grep "legacy routes, aliases, 404 and sitemap"
      - name: Verify bilingual omics-PKPD lessons, quizzes, responsive navigation and live AUC example
        env:
          LABS_E2E_PREBUILT: "true"
        run: npx playwright test --config playwright.multiomics.config.js tests/e2e/cross-domain-omics-pkpd.spec.js
      - name: Verify Multiomics readable themes and single-omic shortcut
        env:
          LABS_E2E_PREBUILT: "true"
        run: npx playwright test --config playwright.multiomics.config.js tests/e2e/multiomics-contrast.spec.js
