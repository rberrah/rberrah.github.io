name: Public site quality audit

on:
  pull_request:
    paths:
      - '.github/workflows/public-site-quality.yml'
      - 'scripts/audit_live_accessibility.mjs'
      - 'scripts/audit_live_lighthouse.mjs'
      - 'scripts/check_live_sitemaps.py'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy qualified PMx Pages']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: public-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN }}

jobs:
  sitemap:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Live sitemap HTTP and XML audit
        run: |
          set -o pipefail
          mkdir -p quality-audit
          python3 scripts/check_live_sitemaps.py | tee quality-audit/sitemap.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-sitemap-http
          path: quality-audit/
          if-no-files-found: warn
  accessibility:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Scan the live site (WCAG automated A/AA)
        run: node scripts/audit_live_accessibility.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-accessibility-wcag
          path: quality-audit/
          if-no-files-found: warn
  lighthouse:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    strategy:
      fail-fast: false
      matrix:
        mode: [mobile, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated Lighthouse
        run: |
          npm install --prefix "$RUNNER_TEMP/lighthouse-tool" --no-save lighthouse@13.6.0
          echo "LIGHTHOUSE_CLI=$RUNNER_TEMP/lighthouse-tool/node_modules/.bin/lighthouse" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Audit live public pages
        run: node scripts/audit_live_lighthouse.mjs ${{ matrix.mode }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-lighthouse-${{ matrix.mode }}
          path: quality-audit/
          if-no-files-found: warn
