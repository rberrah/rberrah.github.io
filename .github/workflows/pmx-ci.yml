name: PMx qualification

on:
  pull_request:
  push:
    branches: [main]

env:
  PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN }}
  BASE_PATH: /pharmacometrie

permissions:
  contents: read

concurrency:
  group: pmx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject all known npm advisories
        run: npm audit --audit-level=low
      - name: Test public origin configuration
        run: node --test scripts/test_site_origin.mjs
      - name: Test PMx educational content and safety contracts
        run: npm run test:pmx
      - name: Test scientific communications
        run: npm run test:communications
      - name: Regenerate tracked artifacts and reject drift
        run: |
          npm run generate:all
          git diff --exit-code
      - name: Check Svelte
        run: npm run check
      - name: Build PMx Explain
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fetch standalone MultiOmics from immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(node -p "JSON.parse(require('fs').readFileSync('integration/multiomics-release.json','utf8')).sha")"
          source_dir="$RUNNER_TEMP/multiomics-source"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/rberrah/MultiOmics.git
          git -C "$source_dir" fetch --depth 1 origin "$sha"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$sha"
          echo "MULTIOMICS_DIR=$source_dir" >> "$GITHUB_ENV"
      - name: Build standalone MultiOmics for canonical /multiomics/ route
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$MULTIOMICS_DIR"
            npm ci
            env -u BASE_PATH npm run build
            node scripts/build_short_url_overlay.mjs
            node scripts/test_short_url_overlay.mjs
          )
      - name: Assemble portal and PMx Explain
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          if [ -e portal/pharmacometrie ]; then
            echo "::error::portal/pharmacometrie collides with the SvelteKit build"
            exit 1
          fi
          cp -r portal/. dist/
          mkdir -p dist/pharmacometrie
          cp -r build/. dist/pharmacometrie/
      - name: Mount verified standalone MultiOmics at canonical root route
        run: node scripts/apply_multiomics_root_overlay.mjs "$MULTIOMICS_DIR/short-url-overlay" dist
      - name: Replace historical PMx MultiOmics copy with compatibility aliases
        run: node scripts/write_multiomics_legacy_aliases.mjs dist
      - name: Verify and configure the public artifact
        run: |
          set -euo pipefail
          for file in \
            dist/index.html \
            dist/assets/site.css \
            dist/a-propos/index.html \
            dist/communications/index.html \
            dist/communications/netpk-peprsn-2026/index.html \
            dist/pharmacometrie/index.html
          do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          node scripts/configure_site_origin.mjs
          node scripts/add_portal_analytics.mjs
          npm run audit:public-artifact
      - name: Verify canonical MultiOmics mount and legacy aliases (desktop/mobile)
        run: npx playwright test --config playwright.multiomics-mount.config.js --workers=1 --retries=0
      - name: Test assembled portal in browser
        run: npx playwright test --config playwright.portal.config.js
      - name: Test PMx application in browser
        env:
          LABS_E2E_PREBUILT: "true"
        run: npm run test:e2e:pmx
      # The source gate runs after local browser qualification so a pending
      # upstream scientific run cannot hide defects in the assembled candidate.
      # No Pages artifact is uploaded and nothing is deployed unless it passes.
      - name: Qualify pinned independent MultiOmics source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify_multiomics_upstream_release.mjs
      - name: Qualify pinned independent Omics2PK site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify_omics2pk_upstream_release.mjs
      - name: Preserve qualified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: pmx-pages-dist
          path: dist
          if-no-files-found: error
          retention-days: 2


  scientific-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize MIPD browser snapshot from immutable source
        run: npm run mipd:materialize
      - name: Test PMx laboratories and model imports
        run: npm run test:labs && npm run test:mlxtran

  mipd-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch standalone MIPD Engine from immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(node -p "JSON.parse(require('fs').readFileSync('integration/mipd-release.json','utf8')).sha")"
          source_dir="$RUNNER_TEMP/mipd-engine-source"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/rberrah/MIPD-Engine.git
          git -C "$source_dir" fetch --depth 1 origin "$sha"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$sha"
          echo "MIPD_ENGINE_DIR=$source_dir" >> "$GITHUB_ENV"
      - name: Materialize MIPD browser snapshot from immutable source
        run: npm run mipd:materialize
      - name: Verify PMx consumer against standalone engine and model library
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify_mipd_consumer.mjs "$MIPD_ENGINE_DIR"
          MIPD_ENGINE_DIR="$MIPD_ENGINE_DIR" node scripts/test_tdm_model_sync.mjs
          MIPD_ENGINE_DIR="$MIPD_ENGINE_DIR" node scripts/test_lego_external_imports.mjs
          MIPD_ENGINE_DIR="$MIPD_ENGINE_DIR" node scripts/test_production_safety.mjs
          MIPD_ENGINE_DIR="$MIPD_ENGINE_DIR" node scripts/audit_ml_artifacts.mjs
      - name: Qualify pinned independent MIPD source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify_mipd_upstream_release.mjs

  scientific-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch standalone MIPD Engine from immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(node -p "JSON.parse(require('fs').readFileSync('integration/mipd-release.json','utf8')).sha")"
          source_dir="$RUNNER_TEMP/mipd-engine-source"
          rm -rf "$source_dir"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/rberrah/MIPD-Engine.git
          git -C "$source_dir" fetch --depth 1 origin "$sha"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$sha"
          echo "MIPD_ENGINE_DIR=$source_dir" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R dependencies
        run: Rscript -e "install.packages(c('mrgsolve', 'mapbayr', 'dplyr', 'jsonlite', 'htmltools', 'xgboost', 'DALEX', 'digest'))"
      - name: Test standalone TDM engine core
        shell: bash
        run: |
          cd "$MIPD_ENGINE_DIR"
          TDM_SMOKE_CORE_ONLY=true Rscript tests/smoke_test.R
      - name: Test standalone safe Lego contract
        run: cd "$MIPD_ENGINE_DIR" && Rscript tests/safe_lego_test.R
      - name: Compile and validate standalone model library
        run: cd "$MIPD_ENGINE_DIR" && Rscript tests/validate_library.R
      - name: Test standalone deterministic model reference cases
        run: cd "$MIPD_ENGINE_DIR" && Rscript tests/model_reference_cases.R
      - name: Test standalone private session cleanup and interrupted calculations
        run: cd "$MIPD_ENGINE_DIR" && Rscript tests/privacy_nonretention_test.R

  scientific-pmetrics:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      PMETRICS_VERSION: "3.2.6"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - name: Fetch standalone MIPD Engine from immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(node -p "JSON.parse(require('fs').readFileSync('integration/mipd-release.json','utf8')).sha")"
          source_dir="$RUNNER_TEMP/mipd-engine-source"
          rm -rf "$source_dir"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/rberrah/MIPD-Engine.git
          git -C "$source_dir" fetch --depth 1 origin "$sha"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$sha"
          echo "MIPD_ENGINE_DIR=$source_dir" >> "$GITHUB_ENV"
      - name: Install pinned Pmetrics and backend dependencies
        run: |
          Rscript -e 'rv <- paste(R.version$major, strsplit(R.version$minor, "\\.")[[1]][1], sep = "."); binary_repo <- function(universe) sprintf("https://%s.r-universe.dev/bin/linux/resolute-%s/%s", universe, R.version$arch, rv); cran_repo <- Sys.getenv("RSPM", unset = "https://cloud.r-project.org"); options(timeout = 600, repos = c(LAPKB = binary_repo("lapkb"), CRAN = cran_repo)); install.packages(c("Pmetrics", "mrgsolve", "mapbayr", "jsonlite")); stopifnot(as.character(packageVersion("Pmetrics")) == Sys.getenv("PMETRICS_VERSION"))'
      - name: Report native scientific versions
        run: Rscript -e 'cat("R version:", as.character(getRversion()), "\nPmetrics version:", as.character(packageVersion("Pmetrics")), "\n")'
      - name: Install Node dependencies
        run: npm ci
      - name: Materialize MIPD browser snapshot from immutable source
        run: npm run mipd:materialize
      - name: Compile and simulate native Pmetrics structures
        run: npm run test:pmetrics-native
      - name: Test Pmetrics TDM backend
        run: npm run tdm:test-pmetrics
      - name: Reproduce the official Pmetrics example
        run: npm run test:pmetrics-official
      - name: Compare experimental NPOD runs
        continue-on-error: true
        run: npm run test:pmetrics-npod
