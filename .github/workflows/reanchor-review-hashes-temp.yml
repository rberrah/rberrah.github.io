name: Temporary review-hash migration

on:
  push:
    branches:
      - migration/sveltekit3-20261017

permissions:
  contents: write

jobs:
  reanchor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prove no chapter scientific content changed
        run: test -z "$(git diff origin/main --name-only -- src/content/chapters)"
      - name: Re-anchor reviewed visualization hashes after framework-only import migration
        run: |
          npm run review:seal -- --changed --yes
          npm run viz:inventory
      - name: Commit hash-format re-anchor
        run: |
          rm .github/workflows/reanchor-review-hashes-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/content/visualizationReviews.js docs/visualization-review.md .github/workflows/reanchor-review-hashes-temp.yml
          git commit -m "chore: re-anchor visualization hashes after framework migration"
          git push origin HEAD:migration/sveltekit3-20261017
