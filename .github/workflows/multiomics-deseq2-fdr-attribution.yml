name: DESeq2 P0 FDR attribution — independent synthetic ablations

on:
  pull_request:
    paths:
      - 'multiomics-engine/validation/deseq2_fdr_attribution.R'
      - 'multiomics-engine/validation/README.md'
      - '.github/workflows/multiomics-deseq2-fdr-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

# Independent of PR #52 (400 datasets, 1200 fits) and PR #54.
# A successful job means measurements were completed, not that FDR is controlled.
jobs:
  independent-fdr-investigation:
    name: Real DESeq2 5 x 60 null simulations and matched diagnostic variants
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PMX_DESEQ2_FDR_DIAG_REPS: '60'
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            bioc::DESeq2
            any::jsonlite
          cache-version: 1
      - name: Execute 300 independent null datasets and three DESeq2 tests each
        run: |
          Rscript multiomics-engine/validation/deseq2_fdr_attribution.R \
            tmp/omics-rnaseq-deseq2-attribution
      - name: Upload complete and negative evidence even if analysis fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deseq2-rnaseq-fdr-diagnostic-replicates-and-summary
          path: tmp/omics-rnaseq-deseq2-attribution/
          if-no-files-found: warn
          retention-days: 90
