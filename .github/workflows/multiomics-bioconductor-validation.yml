name: Multi-omics full Bioconductor reference benchmark

# This job installs the actual Bioconductor statistical packages. It is
# deliberately separate from the fast syntax/contract smoke tests.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  bioconductor-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Cache installed R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: multiomics-bioconductor-${{ runner.os }}-r-${{ hashFiles('multiomics-engine/tests/bioconductor_reference_simulation.R') }}
      - name: Install full reference statistical stack
        run: |
          Rscript -e 'install.packages("BiocManager", repos="https://cloud.r-project.org"); BiocManager::install(c("DESeq2", "edgeR", "limma", "statmod"), ask=FALSE, update=FALSE)'
      - name: Fit real DESeq2, edgeR quasi-likelihood and limma-voom models
        run: Rscript multiomics-engine/tests/bioconductor_reference_simulation.R
