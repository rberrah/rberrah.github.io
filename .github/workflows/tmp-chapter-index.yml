name: Temporary chapter index generator

on:
  push:
    branches:
      - perf/chapter-metadata-split-20261016

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/chapter-metadata-split-20261016
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install parser dependencies
        run: npm ci --ignore-scripts
      - name: Generate chapter metadata and search corpus
        run: node scripts/generate_chapter_index.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/content/chapterIndex.generated.json src/lib/content/chapterSearch.generated.json
          if git diff --cached --quiet; then
            echo "Generated chapter files already current."
            exit 0
          fi
          git commit -m "perf: generate chapter metadata index"
          git push origin HEAD:perf/chapter-metadata-split-20261016
