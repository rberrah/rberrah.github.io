name: Temporary KaTeX lockfile update

on:
  push:
    branches:
      - security/katex-019-20261016

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Resolve KaTeX lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        run: |
          rm .github/workflows/tmp-katex-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/tmp-katex-lock.yml
          git commit -m "security: resolve KaTeX 0.19 lockfile"
          git push
