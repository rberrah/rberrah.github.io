name: Temporary PMx lockfile generator

on:
  push:
    branches:
      - security/pmx-dependency-majors-20261016

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Resolve patched dependency graph
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        run: |
          rm .github/workflows/tmp-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/tmp-lockfile.yml
          git commit -m "security: resolve patched PMx dependency lockfile"
          git push
