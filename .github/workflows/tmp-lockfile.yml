name: Temporary PMx lockfile generator

on:
  push:
    branches:
      - security/pmx-dependency-majors-20261016

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Resolve patched dependency graph
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Emit generated lockfile
        run: |
          echo LOCK_B64_BEGIN
          base64 -w0 package-lock.json
          echo
          echo LOCK_B64_END
