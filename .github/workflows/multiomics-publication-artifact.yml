name: MultiOmics publication source artifact

on:
  pull_request:
    paths:
      - 'scripts/build_multiomics_publication_artifact.mjs'
      - 'scripts/test_multiomics_publication_artifact.mjs'
      - 'docs/multiomics-publication-artifact.md'
      - '.github/workflows/multiomics-publication-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publishable-software-evidence:
    name: Source snapshot, software checks and provenance (not scientific certification)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install exact npm lockfile dependencies
        run: npm ci
      - name: Produce source-pinned, evidence-bearing research artifact
        run: |
          node scripts/build_multiomics_publication_artifact.mjs \
            --out tmp/multiomics/publication-artifact --require-r
      - name: Independently recheck archive and actual test logs
        run: |
          node scripts/test_multiomics_publication_artifact.mjs \
            tmp/multiomics/publication-artifact --require-r
      - name: Upload source + checksums + results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiomics-publication-software-artifact
          path: tmp/multiomics/publication-artifact/
          if-no-files-found: warn
          retention-days: 30
