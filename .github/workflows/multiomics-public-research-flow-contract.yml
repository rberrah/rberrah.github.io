name: MultiOmics public researcher journey — live MS AUC and signed ZIP

# PRs validate the candidate and smoke syntax locally. Testing the live site
# before the PR is deployed could reject valid changes or accept stale assets.
# The real MS-AUC upload, ZIP digest and network privacy flow is exercised only
# after Deploy qualified PMx Pages by multiomics-public-route-smoke.yml.
on:
  pull_request:
    paths:
      - 'scripts/check_live_multiomics.mjs'
      - '.github/workflows/multiomics-public-research-flow-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-research-workflow:
    name: Public real CSV upload, analysis, SHA-256 ZIP, no external submission
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax-check actual public smoke before browser launch
        run: node --check scripts/check_live_multiomics.mjs
      - name: Install genuine Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Build candidate PMx app with the real four-button UI
        run: npm run build
      - name: Test candidate four-button layout without asserting live deployment
        env:
          LABS_E2E_PREBUILT: 'true'
        run: npx playwright test --config playwright.multiomics.config.js tests/e2e/multiomics-methods-learning.spec.js --grep "Quick-start demo" --workers=1 --retries=0
