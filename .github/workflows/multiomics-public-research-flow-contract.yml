name: MultiOmics public researcher journey — live MS AUC and signed ZIP

# First qualify changes to the public browser-smoke contract against the actual
# deployed site, independently of Vite's local preview. A successful PR gate
# is necessary, but only the post-deploy smoke verifies the newly published SHA.
on:
  pull_request:
    paths:
      - 'scripts/check_live_multiomics.mjs'
      - '.github/workflows/multiomics-public-research-flow-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-research-workflow:
    name: Public real CSV upload, analysis, SHA-256 ZIP, no external submission
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax-check actual public smoke before browser launch
        run: node --check scripts/check_live_multiomics.mjs
      - name: Install genuine Playwright Chromium
        run: npx playwright install chromium --with-deps
      # PRs must validate their own build, not an older live Pages release.
      # The *real* remote upload/ZIP check runs after deployment in
      # multiomics-public-route-smoke.yml (and on its workflow_dispatch).
      - name: Build candidate static application
        run: npm run build
      - name: Validate candidate four-button omics layout in Chromium
        env:
          LABS_E2E_PREBUILT: "true"
        run: npx playwright test --config playwright.multiomics.config.js tests/e2e/multiomics-methods-learning.spec.js --grep "Quick-start demo" --workers=1 --retries=0
