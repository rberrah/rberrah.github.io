<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirection…</title>
  <script>
    // Les anciennes URLs de la pharmacométrie vivaient à la racine ; elles sont
    // désormais sous /pharmacometrie/. On redirige automatiquement pour ne casser
    // aucun lien enregistré.
    (function () {
      var p = location.pathname;
      var moved = ['/chapitres', '/exercices', '/glossaire', '/a-propos', '/exemple', '/lego', '/slides', '/downloads', '/fiches'];
      var isPharma = moved.some(function (x) { return p === x || p.indexOf(x + '/') === 0; });
      if (isPharma && p.indexOf('/pharmacometrie/') !== 0) {
        location.replace('/pharmacometrie' + p + location.search + location.hash);
      }
    })();
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f7f5f2; color: #23201d; display: grid; place-items: center; min-height: 100dvh; margin: 0; text-align: center; padding: 1.5rem; }
    @media (prefers-color-scheme: dark) { body { background: #14120f; color: #ece7e0; } }
    .box { max-width: 30rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .6rem; }
    p { color: #6b645c; margin: 0 0 1.4rem; }
    @media (prefers-color-scheme: dark) { p { color: #a49c92; } }
    a { display: inline-block; padding: .7rem 1.3rem; border-radius: 10px; background: #1f7a6d; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas ou a été déplacée. Revenez au portail pour choisir un site.</p>
    <a href="/">Retour au portail</a>
  </div>
</body>
</html>
