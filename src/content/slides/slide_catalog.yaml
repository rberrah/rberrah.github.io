# Catalogue des slides — version française, alignée sur les diapositives réelles
# exportées (static/slides/slide-XX.png). Reconstruit en lisant chaque PNG :
# les titres/objectifs décrivent désormais le contenu réel du deck
# « Pharmacométrie Pratique » (R. Berrah, M. Ursino — Inserm / Université de Limoges).
# NB : l'ordre des fichiers PNG ne suit pas le fil narratif de la présentation ;
# chaque entrée décrit le CONTENU réel du fichier correspondant.

- slide: 1
  id: "s01"
  file: "slide-01.png"
  title: "Introduction à la pharmacométrie"
  purpose: "Diapositive de titre du cours."
  key_points: ["Titre", "Auteurs : R. Berrah, M. Ursino", "Inserm · Université de Limoges"]
  tags: ["intro"]
  suggested_module: "pourquoi-pharmacometrie"
  speaker_notes: "Ouverture du cours de pharmacométrie pratique."
- slide: 2
  id: "s02"
  file: "slide-02.png"
  title: "Le problème : « one size fits all » ne marche pas"
  purpose: "Distinguer PK et PD et motiver l'individualisation."
  key_points: ["PK = ce que le corps fait au médicament (ADME)", "PD = ce que le médicament fait au corps", "Variabilité d'exposition et de réponse"]
  tags: ["intro", "pk", "pd"]
  suggested_module: "pourquoi-pharmacometrie"
  speaker_notes: "Cartes PK vs PD ; une même dose ne convient pas à tous."
- slide: 3
  id: "s03"
  file: "slide-03.png"
  title: "Construire un modèle : comme un Lego"
  purpose: "Présenter la construction d'un modèle PK bloc par bloc."
  key_points: ["Compartiments central/périphériques", "Absorption, élimination, Q, CL, ka", "Bloc par bloc, équation par équation"]
  tags: ["model"]
  suggested_module: "clairance-volume-demi-vie"
  speaker_notes: "Analogie Lego : chaque brique = un processus / une équation."
- slide: 4
  id: "s04"
  file: "slide-04.png"
  title: "Comment construire un modèle (1/5)"
  purpose: "Étape 1 du workflow : modèle structural → modèle final."
  key_points: ["Modèle structural", "Mono / bi-compartimental, transit, Tlag, MM"]
  tags: ["model", "workflow"]
  suggested_module: "clairance-volume-demi-vie"
  speaker_notes: "Diagramme de workflow, révélé progressivement au fil du cours."
- slide: 5
  id: "s05"
  file: "slide-05.png"
  title: "Modèle structural : approche A.D.E. (ADME)"
  purpose: "Vue d'ensemble Absorption / Distribution / Élimination."
  key_points: ["Absorption : Tlag, transit, ordre 0/1", "Distribution : 1/2/3 compartiments", "Élimination : linéaire, Michaelis-Menten"]
  tags: ["model", "adme"]
  suggested_module: "clairance-volume-demi-vie"
  speaker_notes: "Trois cartes ADME résumant les briques structurales."
- slide: 6
  id: "s06"
  file: "slide-06.png"
  title: "Métabolisation : l'élimination « chimique »"
  purpose: "Expliquer le rôle du foie et des métabolites."
  key_points: ["Foie = usine chimique", "Métabolite ≠ molécule mère", "Excrétion vs métabolisme"]
  tags: ["adme", "elimination"]
  suggested_module: "clairance-volume-demi-vie"
  speaker_notes: "La molécule mère « disparaît » = éliminée, même si un métabolite subsiste."
- slide: 7
  id: "s07"
  file: "slide-07.png"
  title: "Structural — Absorption : profils"
  purpose: "Comparer les profils d'absorption."
  key_points: ["Absorption orale 1er ordre", "Temps de latence (Tlag)", "3 compartiments de transit"]
  tags: ["absorption"]
  suggested_module: "absorption-orale"
  speaker_notes: "Graphe comparant Ka, Tlag et modèle de transit."
- slide: 8
  id: "s08"
  file: "slide-08.png"
  title: "Structural — Distribution : tri-exponentialité"
  purpose: "Comparer 1, 2 et 3 compartiments (échelle log)."
  key_points: ["1 compartiment", "2 compartiments", "3 compartiments (phases accentuées)"]
  tags: ["distribution"]
  suggested_module: "clairance-volume-demi-vie"
  speaker_notes: "Nombre de compartiments = nombre de phases sur la courbe semi-log."
- slide: 9
  id: "s09"
  file: "slide-09.png"
  title: "Structural — Élimination : linéaire vs Michaelis-Menten"
  purpose: "Opposer élimination d'ordre 1 et saturable."
  key_points: ["Linéaire (ordre 1)", "Michaelis-Menten (saturable)", "Km"]
  tags: ["elimination"]
  suggested_module: "clairance-volume-demi-vie"
  speaker_notes: "MM : élimination saturable, la courbe plonge une fois C < Km."
- slide: 10
  id: "s10"
  file: "slide-10.png"
  title: "Attention aux données disponibles ! (degrés de liberté)"
  purpose: "Introduire l'identifiabilité : DoF = N − P."
  key_points: ["DoF = N points − P paramètres", "Données insuffisantes = infinité de solutions", "Assez de points = estimation robuste"]
  tags: ["estimation", "identifiability"]
  suggested_module: "outils-estimation"
  speaker_notes: "Balance points/paramètres ; sans DoF suffisants, V et CL non identifiables."
- slide: 11
  id: "s11"
  file: "slide-11.png"
  title: "Comment construire un modèle (2/5)"
  purpose: "Ajout de la variabilité au workflow."
  key_points: ["Modèle structural → Variabilité → Final", "IIV, IOV"]
  tags: ["model", "workflow", "variability"]
  suggested_module: "variabilite-iiv-iov"
  speaker_notes: "Le workflow gagne la brique « Variabilité »."
- slide: 12
  id: "s12"
  file: "slide-12.png"
  title: "EDO : le concept de « flux » (modèle hydraulique)"
  purpose: "Analogie hydraulique de l'équation différentielle."
  key_points: ["Réservoirs reliés par un tuyau", "Robinet = clairance", "Flux ≈ clairance × ΔNiveau ; C(t)=Dose/V·e^(-CL/V·t)"]
  tags: ["model", "ode"]
  suggested_module: "clairance-volume-demi-vie"
  speaker_notes: "Débit dépend du diamètre du tuyau (CL) et du niveau (concentration)."
- slide: 13
  id: "s13"
  file: "slide-13.png"
  title: "Variabilité en PKpop : modèles à effets mixtes"
  purpose: "Distinguer effets fixes (θ) et aléatoires (η)."
  key_points: ["Effet fixe θ = patient typique", "Effet aléatoire η = écart individuel", "CLᵢ = CL_pop · e^ηᵢ"]
  tags: ["variability", "mixed-effects"]
  suggested_module: "variabilite-iiv-iov"
  speaker_notes: "L'exponentielle garantit une clairance positive."
- slide: 14
  id: "s14"
  file: "slide-14.png"
  title: "La hiérarchie de la variabilité (IIV vs IOV)"
  purpose: "Séparer variabilité inter-individuelle et inter-occasion."
  key_points: ["IIV : entre patients (≈ constant par patient)", "IOV : chez un même patient, entre occasions", "Si IOV > IIV, le TDM devient difficile"]
  tags: ["variability", "iiv", "iov"]
  suggested_module: "variabilite-iiv-iov"
  speaker_notes: "Danger clinique : forte IOV = patient qui change constamment."
- slide: 15
  id: "s15"
  file: "slide-15.png"
  title: "Comment construire un modèle (3/5)"
  purpose: "Ajout du modèle d'erreur résiduelle au workflow."
  key_points: ["+ Modèle d'erreur résiduelle", "Proportionnelle / additive / combinée"]
  tags: ["model", "workflow", "residual-error"]
  suggested_module: "variabilite-iiv-iov"
  speaker_notes: "Le workflow gagne la brique « erreur résiduelle »."
- slide: 16
  id: "s16"
  file: "slide-16.png"
  title: "Erreur résiduelle (ε)"
  purpose: "Définir l'erreur inexpliquée et ses modèles."
  key_points: ["Additive ε_add (bruit de fond)", "Proportionnelle ε_prop (% de la valeur)", "Combinée : y = f + (f·ε_prop + ε_add)"]
  tags: ["residual-error"]
  suggested_module: "variabilite-iiv-iov"
  speaker_notes: "Écart entre prédiction du modèle et réalité observée au laboratoire."
- slide: 17
  id: "s17"
  file: "slide-17.png"
  title: "Erreur résiduelle : illustration (tacrolimus)"
  purpose: "Visualiser l'impact du niveau d'erreur résiduelle."
  key_points: ["Sans erreur", "Faible (prop 5 %)", "Plus forte (prop 12 %, add 0,05)"]
  tags: ["residual-error"]
  suggested_module: "variabilite-iiv-iov"
  speaker_notes: "Plus l'erreur est grande, plus la courbe a de « marge » autour des points."
- slide: 18
  id: "s18"
  file: "slide-18.png"
  title: "Comment construire un modèle (4/5)"
  purpose: "Ajout de l'effet des covariables au workflow."
  key_points: ["+ Effet des covariables", "Âge, sexe, poids"]
  tags: ["model", "workflow", "covariates"]
  suggested_module: "allometrie"
  speaker_notes: "Le workflow gagne la brique « covariables »."
- slide: 19
  id: "s19"
  file: "slide-19.png"
  title: "Covariables : l'enquête"
  purpose: "Expliquer une partie de la variabilité par la physiologie."
  key_points: ["Morphologie : poids, taille, SC", "Organes : créatinine, bilirubine", "Démographie : âge, sexe"]
  tags: ["covariates"]
  suggested_module: "allometrie"
  speaker_notes: "Pourquoi ce patient diffère-t-il ? → médecine personnalisée."
- slide: 20
  id: "s20"
  file: "slide-20.png"
  title: "Allométrie : la loi de la taille"
  purpose: "Justifier la mise à l'échelle par le poids."
  key_points: ["Un enfant n'est pas un petit adulte", "CL = CL_std · (WT/70)^0,75", "V : exposant souvent 1"]
  tags: ["covariates", "allometry"]
  suggested_module: "allometrie"
  speaker_notes: "La physiologie suit des lois de puissance, pas linéaires."
- slide: 21
  id: "s21"
  file: "slide-21.png"
  title: "Codage des covariables"
  purpose: "Intégrer une covariable dans l'équation d'un paramètre."
  key_points: ["Quantitative : P = P_pop·(COV/COV_med)^β", "Qualitative : P = P_pop·e^(β·CAT)", "Centrage sur la médiane"]
  tags: ["covariates"]
  suggested_module: "allometrie"
  speaker_notes: "Une covariable continue peut être transformée en catégorielle."
- slide: 22
  id: "s22"
  file: "slide-22.png"
  title: "Covariables & pièges : le workflow"
  purpose: "Sélection des covariables et piège du shrinkage."
  key_points: ["Forward : ΔOFV < −3,84 (p<0,05)", "Backward : ΔOFV > 6,63 (p<0,01)", "Piège shrinkage : ne pas utiliser les EBE si shrinkage fort"]
  tags: ["covariates", "diagnostic"]
  suggested_module: "allometrie"
  speaker_notes: "Attention à la plausibilité et à la colinéarité (poids vs IMC)."
- slide: 23
  id: "s23"
  file: "slide-23.png"
  title: "3 approches en pharmacométrie (NCA / PopPK / PBPK)"
  purpose: "Comparer les trois grandes familles d'analyse."
  key_points: ["NCA : descriptif, laisse parler les données", "PopPK : top-down, variabilité, simulation", "PBPK : bottom-up, organe par organe"]
  tags: ["approaches", "nca", "poppk", "pbpk"]
  suggested_module: "trois-approches"
  speaker_notes: "PopPK mis en avant comme standard du cours."
- slide: 24
  id: "s24"
  file: "slide-24.png"
  title: "Comment construire un modèle (5/5)"
  purpose: "Vérification finale et bootstrap."
  key_points: ["Vérifier forward/backward une dernière fois", "Bootstrap (×500) pour la stabilité"]
  tags: ["model", "workflow", "validation"]
  suggested_module: "validation-vpc"
  speaker_notes: "Dernière étape du workflow avant le modèle final."
- slide: 25
  id: "s25"
  file: "slide-25.png"
  title: "Le bootstrap : tester la robustesse du modèle"
  purpose: "Expliquer le rééchantillonnage et l'intervalle de confiance."
  key_points: ["« Clonage virtuel » (rééchantillonnage)", "1000 études virtuelles", "IC 95 % étroit = modèle robuste"]
  tags: ["validation", "bootstrap"]
  suggested_module: "validation-vpc"
  speaker_notes: "Sert à calculer l'incertitude (IC) des paramètres, pas juste une moyenne."
- slide: 26
  id: "s26"
  file: "slide-26.png"
  title: "Pharmacodynamie"
  purpose: "Relier concentration et effet (PD vs PK)."
  key_points: ["Effet vs log(concentration)", "Même workflow, données = effets", "Modélisation conjointe PK/PD"]
  tags: ["pkpd"]
  suggested_module: "pkpd"
  speaker_notes: "L'abscisse n'est plus le temps mais la concentration."
- slide: 27
  id: "s27"
  file: "slide-27.png"
  title: "Différents types d'effet (évolution des modèles PD)"
  purpose: "Montrer la montée en complexité des modèles PD."
  key_points: ["Modèle à effet fixe", "Modèle linéaire E = C·m", "Modèle log-linéaire E = m·log C"]
  tags: ["pkpd"]
  suggested_module: "pkpd"
  speaker_notes: "Les fonctions concentration→effet se complexifient avec le temps."
- slide: 28
  id: "s28"
  file: "slide-28.png"
  title: "Différents types d'effet (Emax et Hill)"
  purpose: "Introduire Emax, sigmoïde et coefficient de Hill."
  key_points: ["Log-linéaire → Emax → Emax sigmoïde", "E = Emax·C^n/(CE50^n+C^n)", "Coefficient de Hill = raideur"]
  tags: ["pkpd", "emax"]
  suggested_module: "pkpd"
  speaker_notes: "Le facteur de forme (Hill) rend la courbe plus ou moins « tout ou rien »."
- slide: 29
  id: "s29"
  file: "slide-29.png"
  title: "Piège : la fenêtre d'observation 20–80 %"
  purpose: "Ne pas confondre modèle apparent et vrai modèle."
  key_points: ["Entre 20 et 80 % de l'effet, tout paraît linéaire", "Gamme complète = vrai modèle sigmoïde", "E = Emax·C^n/(EC50^n+C^n)"]
  tags: ["pkpd", "pitfall"]
  suggested_module: "pkpd"
  speaker_notes: "Il faut des données hors de 20–80 % pour distinguer les modèles."
- slide: 30
  id: "s30"
  file: "slide-30.png"
  title: "PK/PD : effets directs et indirects"
  purpose: "Distinguer effet immédiat et effet retardé."
  key_points: ["Même Tmax = effet direct (même compartiment)", "Tmax différents = effet indirect", "Décalage PK/PD"]
  tags: ["pkpd", "delay"]
  suggested_module: "pkpd"
  speaker_notes: "Cas simple : réutiliser directement un modèle vu avant."
- slide: 31
  id: "s31"
  file: "slide-31.png"
  title: "Effet indirect : 2 cas"
  purpose: "Décrire hystérèse horaire et mécanismes."
  key_points: ["Métabolites actifs / efflux", "Down/up-regulation des récepteurs", "Rétrocontrôles physiologiques"]
  tags: ["pkpd", "delay"]
  suggested_module: "pkpd"
  speaker_notes: "Boucle d'hystérèse E vs C selon le sens du décalage."
- slide: 32
  id: "s32"
  file: "slide-32.png"
  title: "Effet indirect : modèle de l'effet-compartiment (Sheiner)"
  purpose: "Introduire le compartiment d'effet (ke0)."
  key_points: ["Compartiment d'effet = périphérique ou distinct", "ke0 (constante d'équilibrage)", "Décalage PK/PD expliqué"]
  tags: ["pkpd", "delay"]
  suggested_module: "pkpd"
  speaker_notes: "L'« effet » n'est pas forcément dans un compartiment PK."
- slide: 33
  id: "s33"
  file: "slide-33.png"
  title: "Effet indirect : le turnover"
  purpose: "Modéliser la réponse comme un système en renouvellement."
  key_points: ["Production kin, dégradation kout", "dR/dt = kin − kout·R", "Le médicament agit sur kin ou kout"]
  tags: ["pkpd", "turnover"]
  suggested_module: "pkpd"
  speaker_notes: "Le médicament agit sur les processus qui contrôlent R, pas sur R directement."
- slide: 34
  id: "s34"
  file: "slide-34.png"
  title: "Analyse non compartimentale (NCA)"
  purpose: "Présenter l'approche « model-independent »."
  key_points: ["Basée sur algèbre/géométrie", "Règle des trapèzes pour l'AUC", "Cmax, Tmax, AUC"]
  tags: ["nca", "approaches"]
  suggested_module: "trois-approches"
  speaker_notes: "Descriptif : ne suppose aucun modèle compartimental."
- slide: 35
  id: "s35"
  file: "slide-35.png"
  title: "Effet turnover : 4 mécanismes (Sharma & Jusko)"
  purpose: "Détailler inhibition/stimulation de kin/kout."
  key_points: ["Inhibition kin / kout", "Stimulation kin / kout", "dR/dt avec Imax/Smax, IC50/SC50"]
  tags: ["pkpd", "turnover"]
  suggested_module: "pkpd"
  speaker_notes: "Quatre équations selon la cible (production/dégradation) et le sens."
- slide: 36
  id: "s36"
  file: "slide-36.png"
  title: "Et plus… (précurseur, distribution Gamma)"
  purpose: "Ouvrir vers des modèles PD plus avancés."
  key_points: ["Effet indirect avec précurseur", "Distribution Gamma (transduction)", "Modèles V/VI"]
  tags: ["pkpd", "advanced"]
  suggested_module: "pkpd"
  speaker_notes: "Modèles de transduction / temps de transduction τ."
- slide: 37
  id: "s37"
  file: "slide-37.png"
  title: "Pause / transition"
  purpose: "Transition vers la partie pratique."
  key_points: ["Pause", "Suite : exemple pratique sur un jeu de données"]
  tags: ["transition"]
  suggested_module: "outils-estimation"
  speaker_notes: "Diapositive de transition vers l'estimation pratique."
- slide: 38
  id: "s38"
  file: "slide-38.png"
  title: "Le paysage logiciel"
  purpose: "Situer les principaux outils d'estimation."
  key_points: ["NONMEM (référence historique)", "Monolix (interface, SAEM)", "R / nlmixr2 (open-source)"]
  tags: ["tools"]
  suggested_module: "outils-estimation"
  speaker_notes: "Trois familles d'outils, du gold standard réglementaire à l'open-source."
- slide: 39
  id: "s39"
  file: "slide-39.png"
  title: "Estimation : le format des données"
  purpose: "Structurer les données pour l'estimation."
  key_points: ["Colonnes ID, TIME, DV, AMT", "Covariables (CYP, HT, SEX)", "EVID (observation vs administration)"]
  tags: ["tools", "data"]
  suggested_module: "outils-estimation"
  speaker_notes: "Sans format correct, pas d'estimation possible ; attention à EVID."
- slide: 40
  id: "s40"
  file: "slide-40.png"
  title: "Estimation : exemple de code"
  purpose: "Montrer un modèle codé (Monolix / mrgsolve)."
  key_points: ["Bibliothèque de structures (admin/absorption/…)", "Code mrgsolve annoté", "Paramètres, ETA, OMEGA, SIGMA"]
  tags: ["tools", "code"]
  suggested_module: "outils-estimation"
  speaker_notes: "Exemple concret de définition d'un modèle popPK avec Tlag et transit."
- slide: 41
  id: "s41"
  file: "slide-41.png"
  title: "Estimation : FOCE-I vs SAEM"
  purpose: "Comparer deux algorithmes d'estimation."
  key_points: ["FOCE-I : déterministe (NONMEM)", "SAEM : stochastique (Monolix, nlmixr2)", "SAEM plus robuste pour modèles complexes"]
  tags: ["tools", "estimation"]
  suggested_module: "outils-estimation"
  speaker_notes: "FOCE peut rester bloqué dans un minimum local ; SAEM explore l'espace."
- slide: 42
  id: "s42"
  file: "slide-42.png"
  title: "Estimation : qu'est-ce que le SAEM ?"
  purpose: "Décrire le cycle S-A-M de l'algorithme SAEM."
  key_points: ["Étape S : exploration (échantillonnage)", "Étapes A1/A2 : approximation stochastique", "Étape M : maximisation (θ)"]
  tags: ["tools", "estimation"]
  suggested_module: "outils-estimation"
  speaker_notes: "Cycle Initialisation → S → A → M → convergence."
- slide: 43
  id: "s43"
  file: "slide-43.png"
  title: "Validation numérique"
  purpose: "Présenter les critères chiffrés de validation."
  key_points: ["Vraisemblance, RMSE/MSE/R²", "Fonction objectif ; AIC/BIC pénalisent la complexité", "RSE < 30–50 %, shrinkage < 30 %"]
  tags: ["diagnostic", "validation"]
  suggested_module: "validation-vpc"
  speaker_notes: "Un AIC/BIC plus bas est utile mais insuffisant ; éviter le surajustement."
- slide: 44
  id: "s44"
  file: "slide-44.png"
  title: "Validation graphique"
  purpose: "Introduire les graphes diagnostiques standards."
  key_points: ["Obs vs Pred", "Résidus", "VPC (le juge final)"]
  tags: ["diagnostic", "validation", "vpc"]
  suggested_module: "validation-vpc"
  speaker_notes: "Trois familles de graphes, du plus simple au plus décisif (VPC)."
- slide: 45
  id: "s45"
  file: "slide-45.png"
  title: "NCA : limites et solution PopPK"
  purpose: "Justifier le passage de la NCA à la PopPK."
  key_points: ["NCA : exige des données riches, descriptif", "PopPK : gère les données pauvres, prédit", "PopPK sépare BSV et erreur résiduelle"]
  tags: ["nca", "poppk", "approaches"]
  suggested_module: "trois-approches"
  speaker_notes: "La NCA ne prédit pas ; la PopPK permet simulation et covariables."
- slide: 46
  id: "s46"
  file: "slide-46.png"
  title: "Observé vs prédit : le test de réalité"
  purpose: "Distinguer prédictions population (PRED) et individuelles (IPRED)."
  key_points: ["PRED : le patient typique (dispersion normale)", "IPRED : après adaptation bayésienne", "Les points IPRED doivent tomber sur la diagonale"]
  tags: ["diagnostic"]
  suggested_module: "validation-vpc"
  speaker_notes: "Dispersion de PRED normale (l'IIV existe) ; IPRED sur la diagonale."
- slide: 47
  id: "s47"
  file: "slide-47.png"
  title: "Résidus (IWRES) : la chasse au biais"
  purpose: "Lire les résidus pondérés individuels."
  key_points: ["On veut un « bruit blanc » centré sur 0 (−2/+2)", "Forme en banane = modèle linéaire faux", "Forme en éventail = erreur proportionnelle mal modélisée"]
  tags: ["diagnostic", "residuals"]
  suggested_module: "validation-vpc"
  speaker_notes: "Une tendance dans les résidus est un indice de mauvaise spécification."
- slide: 48
  id: "s48"
  file: "slide-48.png"
  title: "VPC : le « crash test »"
  purpose: "Expliquer le Visual Predictive Check."
  key_points: ["1000 études simulées (Monte Carlo)", "Lignes = données réelles (médiane, P5/P95)", "Zones = IC des simulations"]
  tags: ["diagnostic", "vpc"]
  suggested_module: "validation-vpc"
  speaker_notes: "Si les données réelles sortent des tunnels, le modèle ne peut pas simuler."
- slide: 49
  id: "s49"
  file: "slide-49.png"
  title: "Diagnostics techniques : stabilité & covariables"
  purpose: "Présenter convergence, shrinkage et corrélations EBE."
